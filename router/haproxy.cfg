global
    maxconn "${HAPROXY_MAXCONN}"
    log stdout format raw local0 info

resolvers railway
    parse-resolv-conf
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      5s
    hold other      5s
    hold refused    5s
    hold nx         5s
    hold timeout    5s
    hold obsolete   5s

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    retries 2
    timeout connect 5s
    timeout client "${HAPROXY_TIMEOUT_CLIENT}"
    timeout server "${HAPROXY_TIMEOUT_SERVER}"
    timeout check 3s

# Railway healthcheck + monitoring
frontend health
    mode http
    bind :::8080 v4v6
    monitor-uri /health
    http-request return status 200 content-type text/plain lf-string "primary_up=%[nbsrv(redis_primary)] replicas_up=%[nbsrv(redis_replicas)]\n" if { path /status }

frontend read_write
    bind :::6379 v4v6
    default_backend redis_primary

frontend read_only
    bind :::6380 v4v6
    # replicas when any is healthy, otherwise fall back to the primary
    use_backend redis_replicas if { nbsrv(redis_replicas) gt 0 }
    default_backend redis_primary

backend redis_primary
    option tcp-check
    tcp-check connect
    tcp-check send "AUTH default ${REDIS_PASSWORD}\r\n"
    tcp-check expect string +OK
    tcp-check send "INFO replication\r\n"
    tcp-check expect string role:master
    tcp-check send "QUIT\r\n"
    tcp-check expect string +OK
    default-server inter "${HAPROXY_CHECK_INTERVAL}" fastinter 500ms downinter 1s rise 2 fall 2 on-marked-down shutdown-sessions resolvers railway resolve-prefer ipv6 init-addr none
    server node1 "${NODE_1_HOST}:${REDIS_PORT}" check
    server node2 "${NODE_2_HOST}:${REDIS_PORT}" check
    server node3 "${NODE_3_HOST}:${REDIS_PORT}" check

backend redis_replicas
    balance leastconn
    option tcp-check
    tcp-check connect
    tcp-check send "AUTH default ${REDIS_PASSWORD}\r\n"
    tcp-check expect string +OK
    tcp-check send "INFO replication\r\n"
    tcp-check expect string master_link_status:up
    tcp-check send "QUIT\r\n"
    tcp-check expect string +OK
    default-server inter "${HAPROXY_CHECK_INTERVAL}" fastinter 500ms downinter 1s rise 2 fall 2 on-marked-down shutdown-sessions resolvers railway resolve-prefer ipv6 init-addr none
    server node1 "${NODE_1_HOST}:${REDIS_PORT}" check
    server node2 "${NODE_2_HOST}:${REDIS_PORT}" check
    server node3 "${NODE_3_HOST}:${REDIS_PORT}" check
