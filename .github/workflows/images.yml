name: Build images

# Builds the Redis HA node (Redis 8.10.3 + Sentinel) and router (HAProxy 3.4.7)
# images and publishes them to GHCR. The Railway template deploys these images by digest.
on:
  push:
    branches: [main]
    paths: ["node/**", "router/**", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  VERSION: "8.10.3"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: redis-ha-node
            context: node
          - name: redis-ha-router
            context: router
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ env.VERSION }}-${{ steps.vars.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Redis HA (${{ matrix.name }}) for Railway
            org.opencontainers.image.licenses=MIT
